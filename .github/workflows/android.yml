name: Android APK

on:
  push:
    branches:
      - arena/c6ae5af3-vita3k
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Reldebug

jobs:
  android:
    name: Android APK (Reldebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v1

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> "$GITHUB_ENV"

      - name: Install Android SDK packages and vcpkg dependencies
        run: bash ./.ci/setup-android.sh

      - name: Build Android APK
        run: bash ./.ci/build-android.sh artifacts/android

      - name: Stage renamed APK
        run: |
          cp artifacts/android/app.apk "artifacts/android/Vita3K-mali-custom-driver-${BUILD_TYPE,,}.apk"
          ls -lh artifacts/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-mali-custom-driver
          path: artifacts/android/Vita3K-mali-custom-driver-reldebug.apk
          if-no-files-found: error
