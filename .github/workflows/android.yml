name: Android APK

on:
  push:
    branches:
      - arena/c6ae5af3-vita3k
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Reldebug

jobs:
  android:
    name: Android APK (Reldebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/android-sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
              echo "Android SDK not found at $SDK_ROOT" >&2
              exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
              SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager not found in $SDK_ROOT" >&2
              exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          sdkmanager --version

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> "$GITHUB_ENV"

      - name: Install Android SDK packages and vcpkg dependencies
        run: bash ./.ci/setup-android.sh

      - name: Build Android APK
        run: bash ./.ci/build-android.sh artifacts/android

      - name: Stage renamed APK
        run: |
          cp artifacts/android/app.apk "artifacts/android/Vita3K-mali-custom-driver-${BUILD_TYPE,,}.apk"
          ls -lh artifacts/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-mali-custom-driver
          path: artifacts/android/Vita3K-mali-custom-driver-reldebug.apk
          if-no-files-found: error
